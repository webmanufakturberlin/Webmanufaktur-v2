  <style>
    html, body {
      background-color: #040406;
      margin: 0;
      padding: 0;
    }

    /* Structured Grid with Shimmer capability */
    .bg-grid-light {
      background-size: 60px 60px;
      background-image: linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
      mask-image: radial-gradient(circle at center, black 60%, transparent 100%);
    }

    /* Shimmer Mask — scoped to grid background only */
    .bg-grid-light.shimmer-mask {
      mask-image: linear-gradient(60deg, black 40%, rgba(0, 0, 0, 0.2) 50%, black 60%);
      mask-size: 200% 200%;
      animation: gridShimmer 8s linear infinite;
    }

    /* Screen reader only — keeps element in accessibility tree */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
