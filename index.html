  <style>
    /* Structured Grid with Shimmer capability */
    .bg-grid-light {
      background-size: 60px 60px;

    .shimmer-mask {

      animation: gridShimmer 8s linear infinite;

    /* Screen reader only — keeps element in accessibility tree */
    .sr-only {

      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
